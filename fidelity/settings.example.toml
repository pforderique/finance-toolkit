# Copy this file to `settings.toml` and fill in your own values:
#
#   cp fidelity/settings.example.toml fidelity/settings.toml
#
# `settings.toml` is gitignored on purpose -- it holds your real spreadsheet id,
# your real Fidelity account numbers, and the path to your Google key. Never
# commit it. This is the only file you need to set up.

[auth]
# Path to the service-account JSON key you downloaded from Google Cloud.
# See "Google access" in the README for how to create one.
service_account_json = "/absolute/path/to/service-account.json"

[sheet]
# The long id in your sheet's URL:
# https://docs.google.com/spreadsheets/d/<THIS PART>/edit
spreadsheet_id = "YOUR_SPREADSHEET_ID_HERE"
# The tab holding the table, and the table's name.
tab = "Portfolio"
table = "INVESTMENT_HOLDINGS"

[symbols]
# Tickers the tool ignores completely.
ignore_prefixes = []
ignore_exact = [
    "PENDING ACTIVITY",
]
# Money-market / core-position symbols (Fidelity suffixes them with "**", so
# these are matched as prefixes). Their rows carry only a dollar Current value,
# so each is recorded as `cash_ticker` with shares = dollars, avg cost = $1.00.
# All of them collapse into one cash row per account.
cash_prefixes = [
    "SPAXX",
    "FDRXX",
]
cash_ticker = "Cash"

[symbols.aliases]
# Fidelity's CSV symbol -> the ticker your sheet uses.
BRKB = "BRK.B"

[tolerance]
# How far a value can drift before it counts as a change. avg_cost is half a
# cent because Fidelity reports it to 2dp.
shares = 1e-06
avg_cost = 0.005

# One block per Fidelity account. `number` and `name` come from the first two
# columns of the positions CSV; `label` must exactly match one of the Account
# dropdown options in your sheet (`fidelity accounts labels` lists them).
# `number` is matched first, then `name` (Fidelity renames accounts sometimes).
[[accounts]]
number = "X00000000"
name = "Individual"
label = "Fidelity Brokerage"
enabled = true

[[accounts]]
number = "000000001"
name = "ROTH IRA"
label = "Fidelity Roth IRA"
enabled = true

[[accounts]]
number = "000000002"
name = "Health Savings Account"
label = "Fidelity HSA"
enabled = true

# `enabled = false` keeps an account's rows out of scope entirely: its holdings
# are reported as "untouched" and are never added, updated, or deleted.
[[accounts]]
number = "000000003"
name = "Traditional IRA"
label = "Fidelity Brokerage"
enabled = false
