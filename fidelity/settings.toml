[sheet]
spreadsheet_id = "YOUR_SPREADSHEET_ID_HERE"
tab = "Portfolio"
table = "INVESTMENT_HOLDINGS"

[symbols]
ignore_prefixes = [
    "SPAXX",
    "FDRXX",
]
ignore_exact = [
    "PENDING ACTIVITY",
]

[symbols.aliases]
BRKB = "BRK.B"

[tolerance]
shares = 1e-06
avg_cost = 0.005

