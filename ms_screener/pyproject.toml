[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-screener"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "selenium>=4.21.0",
    "webdriver-manager>=4.0.2",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.10.0",
    "typer>=0.9.0",
    "rich>=13.5.2",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["ms_screener*"]
