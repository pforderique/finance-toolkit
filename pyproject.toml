[project]
name = "finance-toolkit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ms-screener",
    "fidelity",
    "trader-agent",
]

[tool.uv.sources]
ms-screener = { workspace = true }
fidelity = { workspace = true }
trader-agent = { workspace = true }

[tool.uv.workspace]
members = ["ms_screener", "fidelity", "trader_agent"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "coverage>=7.9.2",
]
