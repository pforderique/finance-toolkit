[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trader-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ms-screener @ file://../ms_screener",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trader_agent*"]
