[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ms-screener",
    "python-dotenv>=1.1.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["trader_agent*"]

[tool.uv.sources]
ms-screener = { workspace = true }
